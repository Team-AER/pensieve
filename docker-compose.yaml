name: pensieve

# Services
#   db, redis           Postgres 17 + pgvector, Redis (queues)
#   garage              S3-compatible object store for the page archive (single node)
#   storage-init        one-shot: Garage layout, access key and bucket (idempotent, runs on every up)
#   web                 FastAPI app; runs migrations first
#   worker, worker-ai   feed polling; AI tagging, grouping and summaries
#   worker-capture      saved-page captures; drives `browser` over the Playwright protocol
#   browser             headless Chromium on an egress-only network (cannot reach db, redis or garage)

x-app: &app
  image: pensieve:local
  env_file: .env
  environment: &app-env
    PENSIEVE_DATABASE_URL: postgresql+asyncpg://pensieve:${PENSIEVE_POSTGRES_PASSWORD:?Set PENSIEVE_POSTGRES_PASSWORD in .env}@db:5432/pensieve
    PENSIEVE_REDIS_URL: redis://redis:6379/0
    PENSIEVE_SECRET_KEY: ${PENSIEVE_SECRET_KEY:?Set PENSIEVE_SECRET_KEY in .env}
    PENSIEVE_BASE_URL: ${PENSIEVE_BASE_URL:?Set PENSIEVE_BASE_URL in .env}
    PENSIEVE_SESSION_COOKIE_SECURE: ${PENSIEVE_SESSION_COOKIE_SECURE:-true}
    PENSIEVE_S3_ENDPOINT: http://garage:3900
    PENSIEVE_GARAGE_ADMIN_URL: http://garage:3903
    PENSIEVE_BROWSER_WS: ws://browser:3000/
    PENSIEVE_TIKA_URL: http://10.0.1.69:9998/tika
  restart: unless-stopped
  init: true

x-ready: &ready
  db: { condition: service_healthy }
  redis: { condition: service_healthy }
  storage-init: { condition: service_completed_successfully }

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pensieve
      POSTGRES_PASSWORD: ${PENSIEVE_POSTGRES_PASSWORD:?Set PENSIEVE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pensieve
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pensieve -d pensieve"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    shm_size: 256mb
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${PENSIEVE_GARAGE_RPC_SECRET:?Set PENSIEVE_GARAGE_RPC_SECRET in .env (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${PENSIEVE_GARAGE_ADMIN_TOKEN:?Set PENSIEVE_GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  storage-init:
    <<: *app
    command: ["python", "-m", "pensieve.archive", "init-storage"]
    restart: "no"
    depends_on:
      garage: { condition: service_healthy }
  web:
    <<: *app
    build:
      context: .
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn pensieve.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "8000:8000"
    depends_on: *ready
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  worker:
    <<: *app
    command: ["arq", "pensieve.worker.WorkerSettings"]
    healthcheck:
      disable: true
    depends_on: *ready
  worker-ai:
    <<: *app
    command: ["python", "-m", "pensieve.worker", "ai"]  # arq, with max_jobs from the Gateway card
    healthcheck:
      disable: true
    depends_on: *ready
  worker-capture:
    <<: *app
    image: pensieve-capture:local
    build:
      context: .
      args:
        EXTRAS: capture
    command: ["arq", "pensieve.worker.CaptureWorkerSettings"]
    healthcheck:
      disable: true
    networks: [default, capture]
    depends_on:
      <<: *ready
      browser: { condition: service_healthy }
  browser:
    build:
      context: deploy/browser
    image: pensieve-browser:local
    init: true
    ipc: private
    shm_size: 1gb
    networks: [capture, egress]
    restart: unless-stopped

networks:
  default: {}
  capture:
    internal: true  # worker-capture <-> browser only; no route anywhere else
  egress: {}        # the browser's way out to the web; nothing of Pensieve's lives on it

volumes:
  pgdata: {}
  redisdata: {}
  garage-meta: {}
  garage-data: {}
