<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>Save to Pensieve</title></head>
<body class="popup">
  <header><img src="icons/icon-32.png" alt="" width="20" height="20"><strong>Save to Pensieve</strong></header>
  <form id="form">
    <p id="page-title" class="title"></p>
    <p id="page-url" class="url"></p>
    <label>Tags <input id="tags" placeholder="comma separated"></label>
    <label>Note <input id="note" placeholder="Why you're keeping it"></label>
    <label class="check"><input type="checkbox" id="send-page" checked> Send the page as I see it <span class="hint">(for signed-in or paywalled pages)</span></label>
    <button id="save" type="submit">Save</button>
  </form>
  <div id="status" role="status"></div>
  <footer><a href="#" id="options">Settings</a></footer>
  <script src="pensieve.js"></script>
  <script src="popup.js"></script>
</body></html>
