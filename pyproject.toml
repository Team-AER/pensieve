[project]
name = "pensieve"
version = "0.1.0"
description = "Self-hosted RSS reader with a local-LLM layer: categorization, story clustering, reader memory, insights."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Team AER" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.9",
  "bleach>=6.1",
  "argon2-cffi>=23.1",
  "python-dateutil>=2.9",
  "lxml>=5.2",
  "aiobotocore>=2.24",
  "pypdf>=5",
]

[project.urls]
Homepage = "https://github.com/Team-AER/pensieve"
Documentation = "https://github.com/Team-AER/pensieve#readme"
Issues = "https://github.com/Team-AER/pensieve/issues"
Source = "https://github.com/Team-AER/pensieve"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "respx>=0.21",
  "ruff>=0.5",
]
capture = [
    "playwright==1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pensieve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["RUF012", "B008"]  # B008: FastAPI Depends() defaults are idiomatic
