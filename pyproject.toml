[project]
name = "pensieve"
version = "0.1.0"
description = "Self-hosted RSS reader with a local-LLM layer: categorization, story clustering, reader memory, insights."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Team AER" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.53.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.32",
  "itsdangerous>=2.2",
  "sqlalchemy[asyncio]>=2.0.54",
  "asyncpg>=0.31.0",
  "alembic>=1.20.0",
  "pgvector>=0.5.0",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "redis>=8.1.0",
  "arq>=0.28.0",
  "httpx>=0.28.1",
  "feedparser>=6.0.14",
  "trafilatura>=2.2.0",
  "bleach>=6.4.0",
  "argon2-cffi>=25.1.0",
  "python-dateutil>=2.9.0.post0",
  "lxml>=6.1.3",
]

[project.urls]
Homepage = "https://github.com/Team-AER/pensieve"
Documentation = "https://github.com/Team-AER/pensieve#readme"
Issues = "https://github.com/Team-AER/pensieve/issues"
Source = "https://github.com/Team-AER/pensieve"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "httpx>=0.28.1",
  "respx>=0.23.1",
  "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pensieve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["RUF012", "B008"]  # B008: FastAPI Depends() defaults are idiomatic
