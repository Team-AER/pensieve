name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve
          POSTGRES_DB: pensieve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pensieve -d pensieve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PENSIEVE_DATABASE_URL: postgresql+asyncpg://pensieve:pensieve@localhost:5432/pensieve
      PENSIEVE_REDIS_URL: redis://localhost:6379/0
      PENSIEVE_SECRET_KEY: test-only-secret-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag pensieve:test .
