{% extends "manage/layout.html" %}
{% import "_macros.html" as m %}
{% block mtitle %}Profile and password{% endblock %}
{% block content %}
<div class="page-head"><h1>Profile and password</h1></div>
<div class="two-col">
<form class="card section" method="post" action="/manage/account/profile">{{ m.csrf_field(csrf_token) }}
  <div class="card-head"><h2>Profile</h2></div>
  <div class="field"><label>Email</label><input class="input input-sm" value="{{ user.email }}" disabled></div>
  <div class="field"><label for="display_name">Display name</label><input class="input input-sm" id="display_name" name="display_name" value="{{ user.display_name }}"></div>
  <div class="field"><label for="theme">Theme</label>
    <select class="input input-sm" id="theme" name="theme" data-theme-select>{% for t in ['auto','light','dark','sepia'] %}<option value="{{ t }}"{% if theme == t %} selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
  <div class="row"><button class="btn btn-primary btn-sm" type="submit">Save</button></div>
</form>
<form class="card section" method="post" action="/manage/account/password">{{ m.csrf_field(csrf_token) }}
  <div class="card-head"><h2>Change password</h2></div>
  <div class="field"><label for="current_password">Current password</label><input class="input input-sm" id="current_password" type="password" name="current_password" autocomplete="current-password" required></div>
  <div class="field"><label for="new_password">New password</label><input class="input input-sm" id="new_password" type="password" name="new_password" minlength="8" autocomplete="new-password" required></div>
  <div class="field"><label for="confirm_password">Confirm new password</label><input class="input input-sm" id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div>
  <div class="row"><button class="btn btn-primary btn-sm" type="submit">Change password</button></div>
</form>
</div>
{% endblock %}
