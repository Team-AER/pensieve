{% for row in suggestions %}<div class="card"><p><a href="/discover?url={{ row.source.url|urlencode }}">Preview {{ row.source.url|host }}</a></p><p>{{ row.why }}. {{ row.source.rationale }}</p><form method="post" action="/discover/dismiss">{{ m.csrf_field(csrf_token) }}<input type="hidden" name="url" value="{{ row.source.url }}"><button class="btn btn-sm" type="submit">Not interested</button></form></div>{% else %}<p>No additional matching sources. <a href="/discover">Browse all streams</a>.</p>{% endfor %}
