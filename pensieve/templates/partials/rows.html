{% import "_macros.html" as m %}
{% for row in rows %}
{{ m.item_row(row) }}
{% else %}
{% if opts.page == 1 %}
<div class="list-empty">
  <div class="eyebrow">All caught up</div>
  <p class="muted">Nothing here right now.{% if view.kind == 'unread' %} Try <a href="/reader/all">all items</a> or <a href="/manage/feeds">add a feed</a>.{% endif %}</p>
</div>
{% endif %}
{% endfor %}
{% if has_more %}
<div class="sentinel" hx-get="{{ list_url }}?{{ opts.query }}&page={{ opts.page + 1 }}" hx-trigger="revealed" hx-swap="outerHTML" hx-target="this">
  <span class="faint">Loading more…</span>
</div>
{% endif %}
