{% import "_macros.html" as m %}
{% for row in rows %}
{{ m.item_row(row) }}
{% else %}
{% if q and page == 1 %}<div class="list-empty"><div class="eyebrow">No matches</div><p class="muted">Try fewer words, or search a phrase in quotes.</p></div>{% endif %}
{% endfor %}
{% if has_more %}
<div class="sentinel" hx-get="/search?q={{ q|urlencode }}&feed={{ params.feed }}&folder={{ params.folder }}&state={{ params.state }}&since={{ params.since }}&until={{ params.until }}&page={{ page + 1 }}" hx-trigger="revealed" hx-swap="outerHTML" hx-target="this"><span class="faint">Loading more…</span></div>
{% endif %}
